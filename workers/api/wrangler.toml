name = "domainhub-api"
main = "src/index.js"
compatibility_date = "2026-10-31"

[[d1_databases]]
binding = "DB"
database_name = "domainhub-db"
database_id = "bce5b9ed-f4d0-4351-83a3-b1e7342741f0"
migrations_dir = "migrations"

[vars]
APP_ORIGIN = "https://dns.lynli.me"
GITHUB_CALLBACK_URL = "https://lynli.me/api/github-oauth/callback"


[env.test]
name = "domainhub-api-test"

[env.test.vars]
APP_ORIGIN = "https://dns.lynli.me"
AUTH_OTP_TEST_MODE = "true"
AUTH_TEST_EMAIL = "domainhub-test@example.com"

[[env.test.d1_databases]]
binding = "DB"
database_name = "domainhub-db-test"
database_id = "d05796be-1941-4341-b528-0bfadf2bb923"
migrations_dir = "migrations"
