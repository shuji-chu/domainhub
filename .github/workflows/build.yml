name: Pull request checks
on:
  push:
    branches: [feat/auth-core]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: domainhub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check and production build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: domainhub-build
          path: dist/
          if-no-files-found: error

  backend-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: domainhub
          POSTGRES_PASSWORD: domainhub
          POSTGRES_DB: domainhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domainhub -d domainhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://domainhub:domainhub@localhost:5432/domainhub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply initial migration to ephemeral CI database
        run: npx prisma migrate deploy

      - name: Compile NestJS API
        run: npm run build

      - name: Run authentication API integration tests
        env:
          NODE_ENV: test
          PUBLIC_APP_URL: http://127.0.0.1:5173
          SESSION_HASH_PEPPER: ci-session-pepper-not-for-production
          CSRF_SECRET: ci-csrf-secret-not-for-production
          RATE_LIMIT_HMAC_KEY: ci-rate-limit-key-not-for-production
          TOKEN_HASH_PEPPER: ci-token-pepper-not-for-production
          AUDIT_ACTOR_HMAC_KEY: ci-audit-actor-key-not-for-production
        run: npm run test:e2e
