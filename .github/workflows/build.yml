name: Build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domainhub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The repository does not yet contain a committed package-lock.json.
      # npm install creates one in the runner; commit it in a later dependency-freeze change.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check and production build
        run: npm run build

      - name: Upload build and generated dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: domainhub-build
          path: |
            dist/
            package-lock.json
          if-no-files-found: error
