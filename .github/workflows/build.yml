name: Pull request checks
on:
  push:
    branches: [feat/auth-core]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: domainhub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check and production build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: domainhub-build
          path: dist/
          if-no-files-found: error

  cloudflare-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker JavaScript syntax
        run: node --check workers/api/src/index.js
      - name: Validate D1 auth migration
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS oauth_login_codes" workers/api/migrations/0003_github_login_codes.sql
          grep -q "migrations_dir = \"migrations\"" workers/api/wrangler.toml
