name: Temporary TypeScript diagnostics
on:
  push:
    branches: [feat/auth-core]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auth-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p .build-diagnostics
          npx tsc -b --pretty false > .build-diagnostics/typescript.txt 2>&1
          code=$?
          cat .build-diagnostics/typescript.txt
          if [ "$code" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .build-diagnostics/typescript.txt
            git commit -m "chore: capture TypeScript diagnostics [skip ci]"
            git push origin HEAD:feat/auth-core
          fi
