name: Initialize DomainHub production D1
on:
  workflow_dispatch:
    inputs:
      confirm_production_seed:
        description: Type SEED-PRODUCTION to confirm the one-time bootstrap
        required: true
        type: string
jobs:
  seed:
    if: ${{ inputs.confirm_production_seed == 'SEED-PRODUCTION' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate repository Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          case "$CLOUDFLARE_ACCOUNT_ID" in *[!a-fA-F0-9]*|'') echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character hex account ID"; exit 1;; esac
          test "${#CLOUDFLARE_ACCOUNT_ID}" -eq 32 || { echo "::error::CLOUDFLARE_ACCOUNT_ID must be 32 characters"; exit 1; }
      - run: npm install --global wrangler
      - name: Authenticate Wrangler against Cloudflare
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler whoami
      - name: Apply pending D1 migrations
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply domainhub-db --remote
      - name: Seed administrator and isolated test inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute domainhub-db --config workers/api/wrangler.toml --remote --file=./init.sql
