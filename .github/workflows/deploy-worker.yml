name: Deploy DomainHub API Worker
on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY to confirm a manual production deployment
        required: true
        type: string
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate repository production secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DNSHE_API_TOKEN: ${{ secrets.DNSHE_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository Actions secret: $name"
              exit 1
            fi
          done
          case "$CLOUDFLARE_ACCOUNT_ID" in *[!a-fA-F0-9]*|'') echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character hex account ID"; exit 1;; esac
          if [ "${#CLOUDFLARE_ACCOUNT_ID}" -ne 32 ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID must be 32 characters"; exit 1; fi
      - run: npm install --global wrangler
      - name: Authenticate Wrangler against Cloudflare
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler whoami
      - name: Sync optional Worker secrets
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DNSHE_API_TOKEN: ${{ secrets.DNSHE_API_TOKEN }}
          ALI_ACCESS_KEY_ID: ${{ secrets.ALI_ACCESS_KEY_ID }}
          ALI_ACCESS_KEY_SECRET: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
          ALI_DM_ACCOUNT: ${{ secrets.ALI_DM_ACCOUNT }}
          ALI_DM_REGION: ${{ secrets.ALI_DM_REGION }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          OAUTH_STATE_ENCRYPTION_KEY: ${{ secrets.OAUTH_STATE_ENCRYPTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DIGITALOCEAN_TOKEN DNSHE_API_TOKEN ALI_ACCESS_KEY_ID ALI_ACCESS_KEY_SECRET ALI_DM_ACCOUNT ALI_DM_REGION GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET OAUTH_STATE_ENCRYPTION_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              if ! printf '%s' "$value" | wrangler secret put "$name"; then
                echo "::warning::Unable to sync $name. Check the Cloudflare API token's Worker secret edit permission."
              fi
            else
              echo "Optional secret $name is not set; corresponding integration remains disabled."
            fi
          done
      - name: Deploy Worker to Cloudflare
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
