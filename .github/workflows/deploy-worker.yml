name: Deploy DomainHub API Worker
on:
  push:
    branches: [feat/auth-core]
    paths:
      - 'workers/api/**'
      - '.github/workflows/deploy-worker.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global wrangler
      - name: Apply pending D1 migrations
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply domainhub-db --remote
      - name: Sync Worker secrets
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DNSHE_API_TOKEN: ${{ secrets.DNSHE_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$DIGITALOCEAN_TOKEN" ]; then printf '%s' "$DIGITALOCEAN_TOKEN" | wrangler secret put DIGITALOCEAN_TOKEN; fi
          if [ -n "$DNSHE_API_TOKEN" ]; then printf '%s' "$DNSHE_API_TOKEN" | wrangler secret put DNSHE_API_TOKEN; fi
      - name: Deploy Worker
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
